name: Release Experiments

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload assets to (optional)"
        required: false
        default: ""

jobs:
  run-experiments:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync

      - name: Run all experiments
        run: uv run python scripts/run_all.py --run-name release

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-science \
            latexmk

      - name: Compile report PDF
        run: |
          cd docs/report
          latexmk -pdf -interaction=nonstopmode report.tex

      - name: Package results
        run: |
          RESULTS_DIR=$(ls -d results/release* 2>/dev/null || ls -dt results/20* | head -1)
          echo "RESULTS_DIR=$RESULTS_DIR" >> $GITHUB_ENV
          zip -r experiment-results.zip "$RESULTS_DIR"

      - name: Upload to release
        if: github.event_name == 'release' || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.event.release.tag_name }}
          files: |
            experiment-results.zip
            docs/report/report.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact (manual run)
        if: github.event_name == 'workflow_dispatch' && inputs.tag == ''
        uses: actions/upload-artifact@v4
        with:
          name: experiment-results
          path: |
            experiment-results.zip
            docs/report/report.pdf
          retention-days: 30
